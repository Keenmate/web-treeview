<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — Expand/Collapse Fixture</title>
    <style>
        main { padding: 1rem; font-family: sans-serif; }
        h1 { margin: 0 0 1rem; font-size: 1.2rem; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
        .tree-container { border: 1px solid #e2e8f0; padding: 0.5rem; max-width: 520px; }
    </style>
</head>
<body>
    <main>
        <h1>Expand / Collapse Test Fixture</h1>

        <div class="controls">
            <button data-testid="collapse-all">collapseAll()</button>
            <button data-testid="expand-all">expandAll()</button>

            <button data-testid="expand-nodes-single">expandNodes('1.1.1')</button>
            <button data-testid="expand-nodes-array">expandNodes(['1.1.1','2.1.1'])</button>
            <button data-testid="expand-nodes-exclusive">expandNodes('1.1.1', exclusive)</button>
            <button data-testid="expand-nodes-array-exclusive">expandNodes(['1.1.1','3.1.1'], exclusive)</button>

            <button data-testid="collapse-nodes-single">collapseNodes('1.1')</button>
            <button data-testid="collapse-nodes-array">collapseNodes(['1.1','2.1'])</button>

            <button data-testid="expand-all-subtree">expandAll('2')</button>
            <button data-testid="expand-all-array">expandAll(['1','3'])</button>
            <button data-testid="expand-all-exclusive">expandAll('1.1', exclusive)</button>

            <button data-testid="collapse-all-subtree">collapseAll('1')</button>
            <button data-testid="collapse-all-array">collapseAll(['1','2'])</button>
        </div>

        <div class="tree-container">
            <web-treeview id="tree" expand-level="0"></web-treeview>
        </div>
    </main>

    <script type="module">
        import '/src/index.ts';

        const sampleData = [
            { id: 1, path: '1', name: 'A' },
            { id: 11, path: '1.1', name: 'A.1' },
            { id: 111, path: '1.1.1', name: 'A.1.a' },
            { id: 112, path: '1.1.2', name: 'A.1.b' },
            { id: 12, path: '1.2', name: 'A.2' },
            { id: 121, path: '1.2.1', name: 'A.2.a' },
            { id: 122, path: '1.2.2', name: 'A.2.b' },
            { id: 13, path: '1.3', name: 'A.3' },
            { id: 131, path: '1.3.1', name: 'A.3.a' },
            { id: 2, path: '2', name: 'B' },
            { id: 21, path: '2.1', name: 'B.1' },
            { id: 211, path: '2.1.1', name: 'B.1.a' },
            { id: 22, path: '2.2', name: 'B.2' },
            { id: 3, path: '3', name: 'C' },
            { id: 31, path: '3.1', name: 'C.1' },
            { id: 311, path: '3.1.1', name: 'C.1.a' },
            { id: 32, path: '3.2', name: 'C.2' }
        ];

        const sortByPath = (items) =>
            [...items].sort((a, b) => a.path.localeCompare(b.path));

        customElements.whenDefined('web-treeview').then(() => {
            const tree = document.getElementById('tree');
            tree.idMember = 'id';
            tree.pathMember = 'path';
            tree.displayValueMember = 'name';
            tree.sortCallback = ({ items }) => sortByPath(items);
            tree.isSorted = true;
            tree.data = sampleData;

            const wire = (testid, fn) => {
                document.querySelector(`[data-testid="${testid}"]`).addEventListener('click', fn);
            };

            wire('collapse-all', () => tree.collapseAll());
            wire('expand-all', () => tree.expandAll());

            wire('expand-nodes-single', () => tree.expandNodes('1.1.1'));
            wire('expand-nodes-array', () => tree.expandNodes(['1.1.1', '2.1.1']));
            wire('expand-nodes-exclusive', () => tree.expandNodes('1.1.1', { exclusive: true }));
            wire('expand-nodes-array-exclusive', () => tree.expandNodes(['1.1.1', '3.1.1'], { exclusive: true }));

            wire('collapse-nodes-single', () => tree.collapseNodes('1.1'));
            wire('collapse-nodes-array', () => tree.collapseNodes(['1.1', '2.1']));

            wire('expand-all-subtree', () => tree.expandAll('2'));
            wire('expand-all-array', () => tree.expandAll(['1', '3']));
            wire('expand-all-exclusive', () => tree.expandAll('1.1', { exclusive: true }));

            wire('collapse-all-subtree', () => tree.collapseAll('1'));
            wire('collapse-all-array', () => tree.collapseAll(['1', '2']));
        });
    </script>
</body>
</html>
