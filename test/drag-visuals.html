<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — Drag visuals / reject feedback / tree drop zone</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; width: 420px; border: 1px solid #ccc; }
        pre { font-size: 12px; background: #f6f6f6; min-height: 2em; }
    </style>
</head>
<body>
    <!--
      Attributes come straight from the query string (?drop-zone-mode=glow&…),
      applied before the element connects. Data: 3 "Locked" is not draggable,
      2 "NoDrop" refuses drops.
    -->
    <div id="host"></div>
    <pre data-testid="dv-log"></pre>

    <script type="module">
        import '/src/index.ts';
        import { setupTree, logTo } from './fixture-kit.js';

        const data = [
            { id: 1, path: '1', name: 'Alpha', draggable: true, canDrop: true },
            { id: 11, path: '1.1', name: 'Alpha-1', draggable: true, canDrop: true },
            { id: 2, path: '2', name: 'NoDrop', draggable: true, canDrop: false },
            { id: 3, path: '3', name: 'Locked', draggable: false, canDrop: true },
            { id: 4, path: '4', name: 'Delta', draggable: true, canDrop: true }
        ];

        await customElements.whenDefined('web-treeview');
        const tree = document.createElement('web-treeview');
        tree.id = 'tree';
        tree.setAttribute('expand-level', '2');
        tree.setAttribute('drag-drop-mode', 'both');
        tree.setAttribute('is-draggable-member', 'draggable');
        tree.setAttribute('is-drop-allowed-member', 'canDrop');
        for (const [k, v] of new URLSearchParams(location.search)) tree.setAttribute(k, v);
        setupTree(tree, data);
        document.getElementById('host').appendChild(tree);
        for (const type of ['node-drag-reject', 'node-drop-reject']) {
            tree.addEventListener(type, (e) => logTo('dv-log', `${type}:${e.detail.node?.path ?? e.detail.path}`));
        }
        tree.addEventListener('node-drop', (e) =>
            logTo('dv-log', `node-drop:${e.detail.source?.path}:${e.detail.position}:${e.detail.target?.path ?? 'null'}`));
        window.tree = tree;

        // ── Step-wise synthesized pointer drag (so a spec can assert mid-drag) ──
        // The tree drags through core createPointerDrag: pointerdown on the row, then window-level
        // pointermove / pointerup at real coordinates (the hit test is elementFromPoint).
        const row = (p) => tree.shadowRoot.querySelector(`.wtv__node[data-tree-path="${p}"] > .wtv__node-row .wtv__node-content`);
        const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
        let last = { x: 0, y: 0 };
        const at = (el, fx) => {
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width * fx, y: r.top + r.height / 2 };
        };
        const fire = (type, el, { x, y }) => {
            last = { x, y };
            el.dispatchEvent(new PointerEvent(type, {
                bubbles: true, cancelable: true, composed: true, pointerId: 1, pointerType: 'mouse',
                isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y,
            }));
        };
        window.drag = {
            // Press the row and move past the 5px threshold: the drag starts.
            async start(p) {
                const el = row(p);
                const pt = at(el, 0.5);
                fire('pointerdown', el, pt);
                fire('pointermove', el, { x: pt.x + 8, y: pt.y + 8 });
                await frame();
            },
            // Move over a row; returns whether it took the hover (a glow modifier on it).
            async over(p, fx = 0.8) {
                const el = row(p);
                fire('pointermove', el, at(el, fx));
                await frame();
                await frame();
                return { isHovered: [...row(p).classList].some((c) => c.startsWith('wtv__node-content--glow-')) };
            },
            async drop(p, fx = 0.8) {
                const el = row(p);
                const pt = at(el, fx);
                fire('pointermove', el, pt);
                fire('pointerup', el, pt);
                await frame();
            },
            // The floating drop pads live in a core layer (body > .km-layer, its own shadow root).
            pad(pos) {
                for (const layer of document.querySelectorAll('.km-layer')) {
                    const el = layer.shadowRoot?.querySelector(`.wtv__drop-zone--${pos}`);
                    if (el) return el;
                }
                return null;
            },
            async dropOnPad(pos) {
                const el = this.pad(pos);
                const pt = at(el, 0.5);
                fire('pointermove', el, pt);
                await frame();
                fire('pointerup', el, pt);
                await frame();
            },
            // Let go where the pointer is (a drop there, or a reject on a refusing row).
            async release() {
                fire('pointerup', document.body, last);
                await frame();
                await frame();
            },
            // Escape: cancel the drag (no drop), then lift the button.
            async end() {
                window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
                fire('pointerup', document.body, last);
                await frame();
            }
        };
    </script>
</body>
</html>
