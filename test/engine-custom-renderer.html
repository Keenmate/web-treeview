<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — TreeViewEngine + a custom renderer (no element)</title>
    <style>body { font-family: sans-serif; padding: 1rem; }</style>
</head>
<body>
    <!-- The public engine seam (docs/usage.md "Build your own UI"): `new TreeViewEngine(container, options,
         renderer)` without <web-treeview>. #list = a minimal custom renderer (the usage.md example) —
         click toggles; its aria-label comes from config.labels. #bare = an engine with ONLY `nodes` (built-in
         renderer) next to #element (<web-treeview>, same nodes, no attributes): every option the engine isn't
         given has the element's default (displayValueMember 'displayValue', …). Targeted by
         e2e/engine-custom-renderer.spec.ts. window.bareState = a headless TreeViewState given only `data`
         (level 2) — the same defaults (id / path / displayValue). -->
    <div id="list"></div>
    <div id="bare"></div>
    <web-treeview id="element"></web-treeview>

    <script type="module">
        import { TreeViewEngine, TreeViewState } from '/src/index.ts';

        // A page-wide hook the engine's own translateCallback must beat.
        window.components = window.components || {};
        window.components.locale = {
            translateCallback: ({ key }) => (key === 'web-treeview.ariaLabels.tree' ? 'page' : null),
        };

        class ListRenderer {
            mount(container, state, config) {
                this.container = container;
                this.config = config;
                container.setAttribute('role', 'tree');
                const paint = (snapshot) => {
                    container.replaceChildren(...snapshot.flatNodesToRender.map((node) => {
                        const row = document.createElement('div');
                        row.setAttribute('role', 'treeitem');
                        row.dataset.path = node.path;
                        if (node.hasChildren) row.setAttribute('aria-expanded', String(node.isExpanded));
                        row.style.paddingInlineStart = `${((node.level ?? 1) - 1) * 16}px`;
                        row.textContent = state.tree.getNodeDisplayValue(node);
                        row.addEventListener('click', () => state.toggleNodeExpanded(node.path));
                        return row;
                    }));
                };
                this.applyLabels();
                this.off = state.on('state-change', paint);
                paint(state.getSnapshot());
            }
            applyLabels() {
                this.container.setAttribute('aria-label', this.config.labels?.text('ariaLabels.tree') ?? 'Tree');
            }
            updateConfig(partial) {
                Object.assign(this.config, partial);
                if ('labels' in partial) this.applyLabels();
            }
            destroy() {
                this.off?.();
                this.container.replaceChildren();
            }
        }

        const nodes = () => [
            { id: 1, path: '1',   displayValue: 'Documents' },
            { id: 2, path: '1.1', displayValue: 'Projects' },
            { id: 3, path: '2',   displayValue: 'Photos' },
        ];

        window.expanded = [];
        window.engine = new TreeViewEngine(document.getElementById('list'), {
            nodes: nodes(),
            onNodeExpand: ({ node }) => window.expanded.push(node.path),
            translateCallback: ({ key }) => (key === 'web-treeview.ariaLabels.tree' ? 'own' : null),
        }, new ListRenderer());

        // No options but the data: the element's defaults apply (one source, the input table).
        window.bareEngine = new TreeViewEngine(document.getElementById('bare'), { nodes: nodes() });
        // Level 2: a bare headless TreeViewState — no engine, no renderer; the same defaults.
        window.bareState = new TreeViewState({ data: nodes() });
        document.getElementById('element').nodes = nodes();
        window.fixtureReady = true;
    </script>
</body>
</html>
