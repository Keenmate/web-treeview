<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — render context</title>
    <style>
        main { max-width: 900px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, sans-serif; }
        .tree { width: 340px; border: 1px solid #ccc; }
        web-treeview { display: block; }
    </style>
</head>
<body>
    <main>
        <h1>render context</h1>
        <p>Targeted by <code>e2e/render-context.spec.ts</code>. renderIconCallback returns markup stamped
           with the NodeRenderContext fields (inside the <code>.wtv__node-icon</code> wrapper).</p>
        <div class="tree"><web-treeview id="tree" expand-level="3" icon-member="icon" selection-mode="multiple" show-checkboxes></web-treeview></div>
    </main>

    <script type="module">
        import '/src/index.ts';
        const data = [
            { id: 1, path: '1', name: 'Root', icon: 'dot' },
            { id: 2, path: '1.1', name: 'Child', icon: 'dot' },
            { id: 3, path: '1.1.1', name: 'Leaf', icon: 'dot' }
        ];
        customElements.whenDefined('web-treeview').then(() => {
            Object.assign(document.getElementById('tree'), {
                idMember: 'id', pathMember: 'path', displayValueMember: 'name', nodes: data,
                renderIconCallback: (name, ctx) => `<span data-testid="ctx" data-device="${ctx.deviceClass}"`
                    + ` data-level="${ctx.level}" data-haschildren="${ctx.hasChildren}" data-expanded="${ctx.isExpanded}"`
                    + ` data-checked="${ctx.isChecked}" data-selected="${ctx.isSelected}" data-focused="${ctx.isFocused}"`
                    + ` data-cw="${ctx.container.width}">•</span>`
            });
        });
    </script>
</body>
</html>
