<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — contract parity</title>
    <style>
        web-treeview { display: block; max-width: 420px; }
    </style>
</head>
<body>
    <h1>contract parity</h1>
    <p>Targeted by <code>e2e/contract-parity.spec.ts</code>: one plain tree, no theme of its own.
       The spec renders it with and without <code>@keenmate/base-css-variables</code>.</p>

    <web-treeview id="parity" expand-level="2"></web-treeview>

    <script type="module">
        import '/src/index.ts';
        import { setupTree } from './fixture-kit.js';

        await customElements.whenDefined('web-treeview');
        setupTree(document.getElementById('parity'), [
            { id: 'a', path: '1', name: 'Documents' },
            { id: 'b', path: '1.1', name: 'Report.pdf' },
            { id: 'c', path: '1.2', name: 'Notes.txt' },
            { id: 'd', path: '2', name: 'Pictures' },
        ]);
    </script>
</body>
