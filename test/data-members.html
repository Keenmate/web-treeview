<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — Data members / sorting / display value</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; max-width: 480px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <!--
      ?mode=default   no sort config → siblings by display value
      ?mode=order     order-member="rank"
      ?mode=callback  sortCallback (descending by name) + is-sorted
      ?mode=callback-unsorted  the same sortCallback, is-sorted unset
      ?mode=display   display-value-member="missing" + getDisplayValueCallback
      ?mode=members   id-member="key", parent-path-member="parent", level-member="lvl"
    -->
    <div id="host"></div>

    <script type="module">
        import '/src/index.ts';

        const mode = new URLSearchParams(location.search).get('mode') ?? 'default';
        // Deliberately shuffled input order.
        const data = [
            { key: 'k2', path: '2', name: 'Banana', rank: 1, parent: null, lvl: 1 },
            { key: 'k12', path: '1.2', name: 'Cherry', rank: 1, parent: '1', lvl: 2 },
            { key: 'k1', path: '1', name: 'Apple', rank: 3, parent: null, lvl: 1 },
            { key: 'k11', path: '1.1', name: 'Date', rank: 2, parent: '1', lvl: 2 },
            { key: 'k3', path: '3', name: 'Cucumber', rank: 2, parent: null, lvl: 1 }
        ];

        await customElements.whenDefined('web-treeview');
        const tree = document.createElement('web-treeview');
        tree.id = 'tree';
        tree.setAttribute('expand-level', '2');
        tree.pathMember = 'path';
        tree.displayValueMember = 'name';
        tree.idMember = 'key';
        if (mode === 'order') tree.orderMember = 'rank';
        if (mode === 'callback') tree.isSorted = true;
        if (mode === 'callback' || mode === 'callback-unsorted') {
            tree.sortCallback = ({ items }) =>
                [...items].sort((a, b) => String(b.data.name).localeCompare(String(a.data.name)));
        }
        if (mode === 'display') {
            tree.displayValueMember = 'missing';
            tree.getDisplayValueCallback = ({ node }) => `#${node.data.key}:${node.data.name.toUpperCase()}`;
        }
        if (mode === 'members') {
            tree.setAttribute('parent-path-member', 'parent');
            tree.setAttribute('level-member', 'lvl');
        }
        // is-sorted declares the input pre-sorted (parents before children), so
        // hand it path-ordered data; without is-sorted the library sorts itself.
        tree.data = tree.isSorted
            ? [...data].sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }))
            : data;
        document.getElementById('host').appendChild(tree);
        window.tree = tree;
        window.labels = () => [...tree.shadowRoot.querySelectorAll('.wtv__node')].map((el) => {
            const n = tree.getNodeByPath(el.getAttribute('data-tree-path'));
            return '  '.repeat((n?.level ?? 1) - 1) + el.querySelector('.wtv__node-label')?.textContent;
        });
        window.reassign = () => {
            tree.data = [...data, { key: 'k13', path: '1.3', name: 'Elder', rank: 9, parent: '1', lvl: 2 }];
        };
    </script>
</body>
</html>
