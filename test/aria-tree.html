<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — ARIA tree (role tree / treeitem, aria-activedescendant)</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; width: 420px; border: 1px solid #ccc; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <!-- ARIA tree semantics: role="tree" body (aria-label from labels.treeLabel, aria-multiselectable),
         role="treeitem" rows (aria-level / -posinset / -setsize / -expanded / -selected / -checked),
         aria-activedescendant through core /a11y createActiveDescendant (ARIA-only).
         #tree — small tree, single selection, collapsed (expand-level 1):
           1 Fruit ── 1.1 Apple, 1.2 Banana, 1.3 Cherry
           2 Veg ── 2.1 Carrot
           3 Leaf
         #multi — same data, selection-mode multiple, labels.treeLabel "Food".
         #checks — same data, checkboxes, cascade, expand-level 2.
         #big — virtual scroll, 50 roots × 99 children, all expanded.
         Targeted by e2e/aria-tree.spec.ts. -->
    <div id="host"></div>

    <script type="module">
        import '/src/index.ts';
        import { setupTree } from './fixture-kit.js';

        const data = () => [
            { id: 1, path: '1', name: 'Fruit' },
            { id: 11, path: '1.1', name: 'Apple' },
            { id: 12, path: '1.2', name: 'Banana' },
            { id: 13, path: '1.3', name: 'Cherry' },
            { id: 2, path: '2', name: 'Veg' },
            { id: 21, path: '2.1', name: 'Carrot' },
            { id: 3, path: '3', name: 'Leaf' },
        ];
        const bigData = () => {
            const out = [];
            for (let r = 1; r <= 50; r++) {
                out.push({ id: `r${r}`, path: `${r}`, name: `Root ${r}` });
                for (let c = 1; c <= 99; c++) out.push({ id: `r${r}c${c}`, path: `${r}.${c}`, name: `Item ${r}.${c}` });
            }
            return out;
        };

        await customElements.whenDefined('web-treeview');
        const make = (id, attrs, rows, extra = {}) => {
            const tree = document.createElement('web-treeview');
            tree.id = id;
            for (const [k, v] of Object.entries(attrs)) tree.setAttribute(k, v);
            setupTree(tree, rows, extra);
            document.getElementById('host').appendChild(tree);
            return tree;
        };
        window.tree = make('tree', { 'expand-level': '1' }, data());
        window.multi = make('multi', { 'expand-level': '1', 'selection-mode': 'multiple' }, data(), { labels: { treeLabel: 'Food' } });
        window.checks = make('checks', { 'expand-level': '2', 'show-checkboxes': 'true', 'checkbox-mode': 'cascade' }, data());
        window.big = make('big', {
            'expand-level': '1',
            'enable-virtual-scroll': 'true',
            'virtual-scroll-overscan': '5',
            'virtual-scroll-container-height': '300px',
        }, bigData());
        await Promise.all([window.tree, window.multi, window.checks, window.big].map((t) => t.whenReady()));
        window.__ready = true;
    </script>
</body>
</html>
