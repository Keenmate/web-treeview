<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — Virtual scroll / flat / progressive rendering</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; max-width: 480px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <!--
      ?mode=virtual      (default) virtual-scroll, 5000 rows, 400px viewport, overscan 5
      ?mode=progressive  use-flat-rendering + progressive-render, initial-batch-size 10, 2000 rows
      ?mode=flat         use-flat-rendering, progressive off, flat-indent-size 30px, small tree
    -->
    <!-- The element is created + configured in JS BEFORE it connects (like markup). -->
    <div id="host"></div>

    <script type="module">
        import '/src/index.ts';
        import { setupTree } from './fixture-kit.js';

        const params = new URLSearchParams(location.search);
        const mode = params.get('mode') ?? 'virtual';

        // roots × children: root N has children N.1 … N.(per)
        function makeData(roots, per) {
            const out = [];
            for (let r = 1; r <= roots; r++) {
                out.push({ id: `r${r}`, path: `${r}`, name: `Root ${r}` });
                for (let c = 1; c <= per; c++) out.push({ id: `r${r}c${c}`, path: `${r}.${c}`, name: `Item ${r}.${c}` });
            }
            return out;
        }

        await customElements.whenDefined('web-treeview');
        const tree = document.createElement('web-treeview');
        tree.id = 'tree';
        tree.setAttribute('expand-level', '1');
        let data;
        if (mode === 'virtual') {
            tree.setAttribute('virtual-scroll', 'true');
            tree.setAttribute('virtual-overscan', '5');
            tree.setAttribute('virtual-container-height', '400px');
            data = makeData(50, 99); // 5000 nodes, all visible (expand-level=1)
        } else if (mode === 'progressive') {
            tree.setAttribute('use-flat-rendering', 'true');
            tree.setAttribute('progressive-render', 'true');
            tree.setAttribute('initial-batch-size', '10');
            data = makeData(20, 99); // 2000 nodes
            // Record the rendered row count every frame until it stops growing.
            window.rowCounts = [];
            const sample = () => {
                const n = tree.shadowRoot?.querySelectorAll('.wtv__node').length ?? 0;
                window.rowCounts.push(n);
                if (n < 2000 && window.rowCounts.length < 600) requestAnimationFrame(sample);
            };
            window.startSampling = () => requestAnimationFrame(sample);
        } else {
            tree.setAttribute('use-flat-rendering', 'true');
            tree.setAttribute('progressive-render', 'false');
            tree.setAttribute('flat-indent-size', '30px');
            data = [
                { id: '1', path: '1', name: 'Root' },
                { id: '1.1', path: '1.1', name: 'Child' },
                { id: '1.1.1', path: '1.1.1', name: 'Grandchild' }
            ];
            tree.setAttribute('expand-level', '3');
        }
        setupTree(tree, data);
        window.startSampling?.();
        document.getElementById('host').appendChild(tree);
        window.tree = tree;
        window.rowPaths = () => [...tree.shadowRoot.querySelectorAll('.wtv__node')].map((e) => e.getAttribute('data-tree-path'));
    </script>
</body>
</html>
