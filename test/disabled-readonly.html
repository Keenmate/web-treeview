<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — disabled / readonly</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; max-width: 480px; border: 1px solid #ccc; }
        pre { font-size: 12px; background: #f6f6f6; min-height: 2em; }
    </style>
</head>
<body>
    <!-- ?state=disabled|readonly sets the attribute in the markup-equivalent first batch -->
    <button type="button" data-testid="before">before</button>
    <web-treeview id="tree" expand-level="1" show-checkboxes="true" drag-drop-mode="both"
        selection-mode="multiple" is-selectable-member="selectable"></web-treeview>
    <button type="button" data-testid="after">after</button>
    <pre data-testid="log"></pre>

    <script type="module">
        import '/src/index.ts';
        import { setupTree, logEvents } from './fixture-kit.js';

        const params = new URLSearchParams(location.search);
        const data = [
            { id: 1, path: '1', name: 'A', selectable: true },
            { id: 11, path: '1.1', name: 'A1', selectable: true },
            { id: 12, path: '1.2', name: 'A2', selectable: true },
            { id: 2, path: '2', name: 'B', selectable: true },
            { id: 21, path: '2.1', name: 'B1', selectable: true },
            { id: 3, path: '3', name: 'C', selectable: true }
        ];

        await customElements.whenDefined('web-treeview');
        const tree = document.getElementById('tree');
        const state = params.get('state');
        if (state === 'disabled' || state === 'readonly') tree.setAttribute(state, '');
        setupTree(tree, data, {
            getContextMenuItemsCallback: () => ['copy', 'cut', 'paste', 'delete', 'expand', 'sort-all'],
        });
        logEvents(tree, 'log', [
            'node-click', 'selection-change', 'checked-change', 'expanded-change', 'focus-change',
            'node-drag-start', 'node-drop', 'node-copy', 'node-cut', 'node-delete', 'node-paste'
        ]);
        window.tree = tree;
    </script>
</body>
</html>
