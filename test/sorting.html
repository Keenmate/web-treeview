<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — Sorting Fixture</title>
    <style>
        main { padding: 1rem; font-family: sans-serif; }
        .tree-container { border: 1px solid #e2e8f0; padding: 0.5rem; max-width: 520px; }
    </style>
</head>
<body>
    <main>
        <h1>Sorting Fixture</h1>
        <p>isSortingEnabled / enable-sorting, sortNodes / sortAll, nodes-reorder, sort menu built-ins.
            <code>window.make({ attrs, props, nodes })</code> builds a fresh tree in <code>#host</code>.</p>
        <div class="tree-container" id="host"></div>
    </main>

    <script type="module">
        import '/src/index.ts';

        // Unsorted input on purpose: "Item 10" before "Item 2" (numeric-aware collator puts 2 first).
        window.baseNodes = () => [
            { id: 3, path: '3', name: 'Item 10', order: 30 },
            { id: 1, path: '1', name: 'Item 2', order: 10 },
            { id: 2, path: '2', name: 'Item 1', order: 20 },
            { id: 11, path: '1.1', name: 'b', order: 20 },
            { id: 12, path: '1.2', name: 'a', order: 10 },
            { id: 111, path: '1.1.1', name: 'y', order: 10 },
            { id: 112, path: '1.1.2', name: 'x', order: 20 },
        ];

        window.make = async ({ attrs = {}, props = {}, nodes } = {}) => {
            await customElements.whenDefined('web-treeview');
            const host = document.getElementById('host');
            host.innerHTML = '';
            const tree = document.createElement('web-treeview');
            tree.id = 'tree';
            tree.setAttribute('expand-level', '9');
            for (const [k, v] of Object.entries(attrs)) tree.setAttribute(k, v);
            tree.idMember = 'id';
            tree.pathMember = 'path';
            tree.displayValueMember = 'name';
            Object.assign(tree, props);
            tree.nodes = nodes ?? window.baseNodes();
            window.__reorders = [];
            tree.addEventListener('nodes-reorder', (e) => window.__reorders.push({
                parentPath: e.detail.parentPath,
                nodes: e.detail.nodes.map((n) => n.path),
                changes: e.detail.changes,
            }));
            host.appendChild(tree);
            await tree.whenReady();
            window.tree = tree;
            return true;
        };

        /** Visible rows (display names) in DOM order. */
        window.rowNames = () => [...window.tree.shadowRoot.querySelectorAll('.wtv__node')]
            .map((e) => e.querySelector('.wtv__node-label')?.textContent?.trim() ?? '');
        /** Child display names of one parent ('' = roots), in tree order. */
        const parentOf = (path) => (path ? window.tree.getNodeByPath(path) : window.tree.getTree().root);
        window.childNames = (path) => Object.values(parentOf(path).children).map((n) => n.data.name);
        /** orderMember values of one parent's children, in tree order. */
        window.childOrders = (path) => Object.values(parentOf(path).children).map((n) => n.data.order);
    </script>
</body>
</html>
