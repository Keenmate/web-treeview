<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — Silent Selection Fixture</title>
    <style>
        main { padding: 1rem; font-family: sans-serif; max-width: 720px; }
        h1 { margin: 0 0 1rem; font-size: 1.2rem; }
        .tree-container { border: 1px solid #e2e8f0; padding: 0.5rem; max-width: 520px; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; }
        .readouts { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 0.75rem; margin-top: 0.75rem; font-family: monospace; font-size: 0.85rem; }
        .readouts dt { font-weight: 600; }
        .readouts dd { margin: 0; }
        /* Custom selected class so silent path still updates the DOM. */
        :root { --test-selected: rgb(254, 240, 138); }
        web-treeview { display: block; }
    </style>
</head>
<body>
    <main>
        <h1>Silent Selection Fixture</h1>

        <div class="controls">
            <button data-testid="reset-counters">reset counters</button>
            <button data-testid="select-loud">selectNode('1.2') loud</button>
            <button data-testid="select-silent">selectNode('1.2') silent</button>
            <button data-testid="select-other-silent">selectNode('2.1') silent</button>
            <button data-testid="select-many-loud">selectNodes(['1.1','1.2']) loud</button>
            <button data-testid="select-many-silent">selectNodes(['1.1','1.2']) silent</button>
            <button data-testid="clear-loud">clearSelection() loud</button>
            <button data-testid="clear-silent">clearSelection() silent</button>
            <button data-testid="clear-checked-loud">clearChecked() loud</button>
            <button data-testid="clear-checked-silent">clearChecked() silent</button>
        </div>

        <div class="tree-container">
            <web-treeview id="tree"
                expand-level="2"
                selection-mode="multi"
                show-checkboxes="true"
                selected-node-class="test-selected"></web-treeview>
        </div>

        <dl class="readouts">
            <dt>counter-click</dt><dd data-testid="counter-click">0</dd>
            <dt>counter-selection</dt><dd data-testid="counter-selection">0</dd>
            <dt>counter-checked</dt><dd data-testid="counter-checked">0</dd>
            <dt>last-clicked</dt><dd data-testid="last-clicked">(none)</dd>
            <dt>selected-size</dt><dd data-testid="selected-size">0</dd>
            <dt>selected-paths</dt><dd data-testid="selected-paths"></dd>
            <dt>checked-size</dt><dd data-testid="checked-size">0</dd>
        </dl>
    </main>

    <script type="module">
        import '/src/index.ts';

        const data = [
            { id: 1, path: '1', name: 'Root A' },
            { id: 11, path: '1.1', name: 'A.1' },
            { id: 12, path: '1.2', name: 'A.2' },
            { id: 2, path: '2', name: 'Root B' },
            { id: 21, path: '2.1', name: 'B.1' }
        ];

        const sortByPath = (items) =>
            [...items].sort((a, b) => a.path.localeCompare(b.path));

        function setText(id, text) {
            document.querySelector(`[data-testid="${id}"]`).textContent = text;
        }

        const counters = { click: 0, selection: 0, checked: 0 };

        function bump(name) {
            counters[name]++;
            setText(`counter-${name}`, String(counters[name]));
        }

        customElements.whenDefined('web-treeview').then(() => {
            const tree = document.getElementById('tree');
            tree.idMember = 'id';
            tree.pathMember = 'path';
            tree.displayValueMember = 'name';
            tree.sortCallback = ({ items }) => sortByPath(items);
            tree.isSorted = true;
            tree.data = data;

            tree.addEventListener('node-click', (e) => {
                bump('click');
                setText('last-clicked', e.detail.node.path);
            });
            tree.addEventListener('selection-change', (e) => {
                bump('selection');
                const paths = [...e.detail.paths].sort();
                setText('selected-size', String(paths.length));
                setText('selected-paths', paths.join(','));
            });
            tree.addEventListener('checked-change', (e) => {
                bump('checked');
                setText('checked-size', String(e.detail.paths.size));
            });

            // Mirror the selected set into the readout even when the change came
            // through the silent path (no event fires). The buttons below trigger
            // a refresh right after calling the silent API.
            function refreshSelectionReadout() {
                const paths = [...tree.getSelectedPaths()].sort();
                setText('selected-size', String(paths.length));
                setText('selected-paths', paths.join(','));
            }
            function refreshCheckedReadout() {
                setText('checked-size', String(tree.getCheckedPaths().size));
            }

            const wire = (testid, fn) => {
                document.querySelector(`[data-testid="${testid}"]`).addEventListener('click', () => {
                    fn();
                    // Always refresh state readouts so silent-mode tests still see new state.
                    refreshSelectionReadout();
                    refreshCheckedReadout();
                });
            };

            wire('reset-counters', () => {
                counters.click = counters.selection = counters.checked = 0;
                setText('counter-click', '0');
                setText('counter-selection', '0');
                setText('counter-checked', '0');
                setText('last-clicked', '(none)');
            });

            wire('select-loud',         () => tree.selectNode('1.2'));
            wire('select-silent',       () => tree.selectNode('1.2', 'replace', { silent: true }));
            wire('select-other-silent', () => tree.selectNode('2.1', 'replace', { silent: true }));
            wire('select-many-loud',    () => tree.selectNodes(['1.1', '1.2']));
            wire('select-many-silent',  () => tree.selectNodes(['1.1', '1.2'], { silent: true }));
            wire('clear-loud',             () => tree.clearSelection());
            wire('clear-silent',           () => tree.clearSelection(undefined, { silent: true }));
            wire('clear-checked-loud',   () => tree.clearChecked());
            wire('clear-checked-silent', () => tree.clearChecked(undefined, { silent: true }));
        });
    </script>
    <style>
        /* Selected class applied via selectedNodeClass="test-selected". */
        web-treeview::part(node-content) {}
    </style>
</body>
</html>
