<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — Filter Scope Fixture</title>
    <style>
        main { padding: 1rem; font-family: sans-serif; max-width: 700px; }
        h1 { margin: 0 0 1rem; font-size: 1.2rem; }
        .tree-container { border: 1px solid #e2e8f0; padding: 0.5rem; max-width: 420px; }
    </style>
</head>
<body>
    <main>
        <h1>Filter Scope Fixture</h1>
        <!-- EXPERIMENTAL filter-scope / filter-descendant-depth / expand-filter-descendants.
             Ragged org chart: Sales is 6 levels deep, IT and Finance only 3.
             ?scope=<filter-scope>  ?x=<filter-descendant-depth>  ?expand=0  ?term=<search-term>
             Mirrors svelte-treeview's /test/filter-scope. Targeted by e2e/filter-scope.spec.ts. -->
        <input data-testid="term" />
        <div class="tree-container">
            <web-treeview id="tree" expand-level="1" use-internal-search-index="true"></web-treeview>
        </div>
    </main>

    <script type="module">
        import '/src/index.ts';

        const data = [
            ['1', 'Acme Corp'],
            ['1.1', 'Sales Division'],
            ['1.1.1', 'Sales Europe'],
            ['1.1.1.1', 'Sales Germany'],
            ['1.1.1.1.1', 'Team Berlin'],
            ['1.1.1.1.1.1', 'Anna Weber'],
            ['1.1.1.1.1.2', 'Lukas Schmidt'],
            ['1.1.1.1.2', 'Team Munich'],
            ['1.1.1.1.2.1', 'Mia Fischer'],
            ['1.1.1.1.2.2', 'Jonas Wagner'],
            ['1.1.1.2', 'Sales France'],
            ['1.1.1.2.1', 'Team Paris'],
            ['1.1.1.2.1.1', 'Chloe Martin'],
            ['1.1.1.2.1.2', 'Hugo Bernard'],
            ['1.1.2', 'Sales Americas'],
            ['1.1.2.1', 'Sales USA'],
            ['1.1.2.1.1', 'Team Boston'],
            ['1.1.2.1.1.1', 'Emma Johnson'],
            ['1.1.2.1.1.2', 'Noah Williams'],
            ['1.1.2.1.2', 'Team Austin'],
            ['1.1.2.1.2.1', 'Olivia Brown'],
            ['1.2', 'IT Division'],
            ['1.2.1', 'Platform Team'],
            ['1.2.1.1', 'Petr Novak'],
            ['1.2.1.2', 'Jana Svobodova'],
            ['1.2.2', 'Support Team'],
            ['1.2.2.1', 'Tomas Dvorak'],
            ['1.2.2.2', 'Eva Cerna'],
            ['1.3', 'Finance'],
            ['1.3.1', 'Accounting Team'],
            ['1.3.1.1', 'Karel Horak'],
            ['1.3.2', 'Payroll Team'],
            ['1.3.2.1', 'Lucie Kralova']
        ].map(([path, name], i) => ({ id: i + 1, path, name }));

        const params = new URLSearchParams(location.search);
        const tree = document.getElementById('tree');
        tree.setAttribute('filter-scope', params.get('scope') ?? 'matches');
        tree.setAttribute('filter-descendant-depth', params.get('x') ?? '1');
        tree.setAttribute('expand-filter-descendants', params.get('expand') === '0' ? 'false' : 'true');
        const termInput = document.querySelector('[data-testid="term"]');

        customElements.whenDefined('web-treeview').then(() => {
            tree.idMember = 'id';
            tree.pathMember = 'path';
            tree.displayValueMember = 'name';
            tree.searchValueMember = 'name';
            tree.sortCallback = ({ nodes }) =>
                [...nodes].sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
            if (params.get('term')) { termInput.value = params.get('term'); tree.searchTerm = params.get('term'); }
            tree.nodes = data;
            termInput.addEventListener('input', () => { tree.searchTerm = termInput.value; });
        });
    </script>
</body>
</html>
