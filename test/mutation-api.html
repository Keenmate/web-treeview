<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — Mutation API</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; max-width: 480px; border: 1px solid #ccc; }
        pre { font-size: 12px; background: #f6f6f6; min-height: 2em; }
    </style>
</head>
<body>
    <web-treeview id="tree" expand-level="3"></web-treeview>
    <pre data-testid="mu-log"></pre>

    <script type="module">
        import '/src/index.ts';
        import { setupTree, logEvents } from './fixture-kit.js';

        const data = [
            { id: 1, path: '1', name: 'Fruits' },
            { id: 11, path: '1.1', name: 'Apple' },
            { id: 12, path: '1.2', name: 'Banana' },
            { id: 2, path: '2', name: 'Veg' },
            { id: 21, path: '2.1', name: 'Carrot' },
            { id: 211, path: '2.1.1', name: 'Baby carrot' },
            { id: 3, path: '3', name: 'Nuts' }
        ];

        await customElements.whenDefined('web-treeview');
        const tree = document.getElementById('tree');
        setupTree(tree, data);
        logEvents(tree, 'mu-log', ['tree-change']);
        window.tree = tree;

        /** Names in render order, indented by level: "Fruits", "  Apple", … */
        window.outline = () =>
            tree.getVisibleFlatNodes().map((n) => '  '.repeat(n.level - 1) + n.data.name);
        /** Same, read from the rendered DOM rows. */
        window.domOutline = () =>
            [...tree.shadowRoot.querySelectorAll('.wtv__node')].map((el) => {
                const n = tree.getNodeByPath(el.getAttribute('data-tree-path'));
                return '  '.repeat((n?.level ?? 1) - 1) + el.querySelector('.wtv__node-label')?.textContent;
            });
        window.nodeOf = (name) => tree.getVisibleFlatNodes().find((n) => n.data.name === name) ?? null;
    </script>
</body>
</html>
