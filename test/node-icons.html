<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — per-node icons</title>
    <style>
        main { max-width: 900px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, sans-serif; }
        .tree { width: 340px; border: 1px solid #ccc; margin-bottom: 1rem; }
        web-treeview { display: block; }
    </style>
</head>
<body>
    <main>
        <h1>per-node icons</h1>
        <p>Targeted by <code>e2e/node-icons.spec.ts</code>. Icons render on EVERY node
           (branch + leaf) as a dedicated <code>.wtv__node-icon</code> element.</p>

        <h2>default (class on &lt;i&gt; + icon-color-member)</h2>
        <div class="tree"><web-treeview id="default" expand-level="3" icon-member="icon" icon-color-member="color" align-node-icons></web-treeview></div>

        <h2>getIconCallback returning emoji (text, not a class)</h2>
        <div class="tree"><web-treeview id="emoji" expand-level="3"></web-treeview></div>

        <h2>renderIconCallback (inline SVG / custom)</h2>
        <div class="tree"><web-treeview id="custom" expand-level="3" icon-member="icon"></web-treeview></div>
    </main>

    <script type="module">
        import '/src/index.ts';

        const data = [
            { id: 1, path: '1', name: 'Region', icon: 'fa-sitemap', color: '#7c3aed' },
            { id: 2, path: '1.1', name: 'Manager', icon: 'fa-user-tie', color: '#2563eb' },
            { id: 3, path: '1.1.1', name: 'Employee', icon: 'fa-user' },
            { id: 4, path: '1.2', name: 'Branch', icon: 'fa-building' }
        ];

        customElements.whenDefined('web-treeview').then(() => {
            const d = document.getElementById('default');
            const c = document.getElementById('custom');
            const e = document.getElementById('emoji');
            const common = { idMember: 'id', pathMember: 'path', displayValueMember: 'name', nodes: data };
            Object.assign(d, common);
            Object.assign(e, common, {
                getIconCallback: ({ node }) => (node.path === '1.2' ? 'fa-building' : node.path === '1' ? '🗂️' : '👤')
            });
            Object.assign(c, common, {
                renderIconCallback: ({ value, iconElement: iconEl }) => {
                    iconEl.setAttribute('data-testid', 'custom-icon');
                    iconEl.setAttribute('data-value', value ?? '');
                    iconEl.textContent = '★';
                }
            });
        });
    </script>
</body>
</html>
