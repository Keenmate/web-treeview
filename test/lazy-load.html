<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — Lazy loading (beforeExpandCallback + hasChildrenMember)</title>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        web-treeview { display: block; max-width: 480px; border: 1px solid #ccc; }
        pre { font-size: 12px; background: #f6f6f6; min-height: 2em; }
    </style>
</head>
<body>
    <!--
      The documented lazy-load pattern: beforeExpandCallback loads the children
      (insertBranch) and resolves; the node shows a loading state meanwhile.
        ?mode=load    (default) async load, 30 ms simulated fetch
        ?mode=manual  the load finishes when the test calls window.finishLoad()
        ?mode=reject  the load rejects (node stays collapsed, console.warn)
        ?mode=cancel  the hook returns false for every node (sync cancel)
      Log lines: before:<path> (hook call), inserted:<path>:<count>,
      expand:<path> / collapse:<path> (node-expand / node-collapse events).
    -->
    <web-treeview id="tree" expand-level="0" has-children-member="hasChildren"></web-treeview>
    <pre data-testid="ll-log"></pre>

    <script type="module">
        import '/src/index.ts';
        import { setupTree, logTo } from './fixture-kit.js';

        const mode = new URLSearchParams(location.search).get('mode') ?? 'load';

        // Roots only — "Remote" nodes say they have children but none are loaded yet.
        const data = [
            { id: 1, path: '1', name: 'Remote', hasChildren: true },
            { id: 2, path: '2', name: 'Local leaf', hasChildren: false },
            { id: 3, path: '3', name: 'Remote 2', hasChildren: true },
            { id: 4, path: '4', name: 'Folder', hasChildren: true },
            { id: 41, path: '4.1', name: 'Folder child', hasChildren: false }
        ];
        // What the "server" returns for a parent path.
        const server = {
            '1': [
                { id: 11, path: '1.1', name: 'Remote child A', hasChildren: false },
                { id: 12, path: '1.2', name: 'Remote child B', hasChildren: false }
            ],
            '3': [
                { id: 31, path: '3.1', name: 'Remote 2 child', hasChildren: false }
            ]
        };

        await customElements.whenDefined('web-treeview');
        const tree = document.getElementById('tree');
        setupTree(tree, data, {
            beforeExpandCallback: ({ node, controller }) => {
                logTo('ll-log', `before:${node.path}`);
                if (mode === 'cancel') return false;
                // Already loaded (or a local folder): nothing to fetch — expand now (sync).
                if (controller.getChildren(node.path).length > 0) return;
                const load = () => {
                    const r = controller.insertBranch(node.path, server[node.path] ?? []);
                    logTo('ll-log', `inserted:${node.path}:${r.count}`);
                };
                if (mode === 'reject') {
                    return new Promise((_, reject) => setTimeout(() => reject(new Error('offline')), 30));
                }
                if (mode === 'manual') {
                    return new Promise((resolve) => { window.finishLoad = () => { load(); resolve(); }; });
                }
                return new Promise((resolve) => setTimeout(() => { load(); resolve(); }, 30));
            }
        });
        tree.addEventListener('node-expand', (e) => logTo('ll-log', `expand:${e.detail.node.path}`));
        tree.addEventListener('node-collapse', (e) => logTo('ll-log', `collapse:${e.detail.node.path}`));
        window.tree = tree;
    </script>
</body>
</html>
